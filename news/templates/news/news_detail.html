<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ news.title }}</title>
</head>
<body>
    <p><a href="{% url 'news_list' %}">← Все новости</a></p>

    <p>
    <a href="{% url 'news_update' news.pk %}">Редактировать</a>
    |
    <a href="{% url 'news_delete' news.pk %}">Удалить</a>
</p>
    <h1>{{ news.title }}</h1>

    <p>Категория: {{ news.category.name }}</p>
    <p>Автор: {{ news.author.username }}</p>
    <p>Создано: {{ news.created_at|date:"d.m.Y H:i" }}</p>

    <div>{{ news.content|linebreaks }}</div>
</body>
</html>
