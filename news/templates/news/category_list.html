<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Категории</title>
</head>
<body>
    <h1>Категории новостей</h1>

    <p><a href="{% url 'news_list' %}">← Все новости</a></p>

    {% for category in categories %}
        <section>
            <h2>{{ category.name }}</h2>
            <p>{{ category.description|default:"Описание отсутствует" }}</p>
            <p>Количество новостей: {{ category.news_count }}</p>
        </section>
        <hr>
    {% empty %}
        <p>Категорий пока нет.</p>
    {% endfor %}
</body>
</html>
